[project]
name = "vmsh-tasks-bot"
version = "0.1.0"
description = "Asynchronous Telegram assistant for managing math circle tasks, dashboards, and game updates."
readme = "README.md"
requires-python = ">=3.13"
license = { file = "LICENCE" }
authors = [
    { name = "Sergey Shashkov" },
]
keywords = ["telegram", "aiogram", "aiohttp", "sqlite", "google-sheets"]
dependencies = [
    "aioboto3>=15.5.0",
    "aiogram>=3.24.0",
    "aiohttp>=3.13.3",
    "google-api-python-client>=2.187.0",
    "gspread>=6.2.1",
    "gunicorn>=23.0.0",
    "levenshtein>=0.27.3",
    "mathsolvers",
    "nats-py>=2.12.0",
    "oauth2client>=4.1.3",
    "orjson>=3.11.5",
    "sentry-sdk>=2.49.0",
    "uvloop>=0.22.1",
    "yoyo-migrations>=9.0.0",
]

[dependency-groups]
dev = [
    "aiohttp-cors>=0.8.1",
    "aiohttp-devtools>=1.1.2",
    "aresponses>=3.0.0",
    "coverage>=7.13.1",
    "importlib>=1.0.4",
    "ipython>=9.10.0",
    "paramiko>=4.0.0",
    "py7zr>=1.1.0",
    "pytest>=9.0.2",
    "pytest-aiohttp>=1.1.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.14.11",
    "scp>=0.15.0",
    "setuptools>=80.9.0",
    "twine>=6.2.0",
    "wheel>=0.45.1",
]

[tool.uv.sources]
mathsolvers = { git = "https://github.com/ShashkovS/mathsolvers.git" }
