  <link rel="stylesheet" href="static/mathgame.css">
  <script>
    window.sentryOnLoad = function () {
      let tracingIntegration;
      if (typeof Sentry.browserTracingIntegration === 'function') {
        tracingIntegration = Sentry.browserTracingIntegration(); // v8+
      } else if (typeof Sentry.BrowserTracing === 'function') {
        tracingIntegration = new Sentry.BrowserTracing(); // v7
      }
      console.log({tracingIntegration});
      Sentry.init({
        release: "0.11.8",
        integrations: tracingIntegration ? [tracingIntegration] : [],
        tracesSampleRate: 1.0,
        tracePropagationTargets: ["localhost", /^https:\/\/vmsh179bothzger\.proj179\.ru\/game/],
        sendDefaultPii: true,
      });
    };
  </script>
  <script
      src="https://js.sentry-cdn.com/cc3be8abf24c7da64429b0aa7cfa440c.min.js"
      crossorigin="anonymous"
  ></script>
