# Installed as /etc/nginx/snippets/vmshpwa-proxy-headers.conf.
#
# This is a replacement boundary. Never use $proxy_add_x_forwarded_for or any
# $http_forwarded/$http_x_forwarded_* value here: the public client must not be
# able to contribute forwarding evidence accepted by aiohttp.
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header Forwarded "for=\"$remote_addr\";proto=https;host=\"$host\"";

# An empty value suppresses the incoming header at the upstream boundary.
proxy_set_header X-Forwarded-For "";
proxy_set_header X-Forwarded-Host "";
proxy_set_header X-Forwarded-Proto "";
proxy_set_header X-Forwarded-Port "";
proxy_set_header X-Forwarded-Prefix "";
proxy_set_header X-Forwarded-Server "";
proxy_set_header X-Forwarded-Ssl "";
proxy_set_header X-Real-IP "";
proxy_set_header Proxy "";

proxy_connect_timeout 5s;
proxy_request_buffering on;
