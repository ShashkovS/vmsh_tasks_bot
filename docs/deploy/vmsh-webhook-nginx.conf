# Include this file inside the existing vmsh.shashkovs.ru TLS server block.
    location = /_github/webhook {
        limit_except POST {
            deny all;
        }

        client_max_body_size 1m;
        client_body_timeout 10s;

        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /web/vmsh_tasks_bot/deploy/bin/vmsh-webhook.cgi;
        fastcgi_param SCRIPT_NAME /_github/webhook;
        fastcgi_param REQUEST_METHOD $request_method;
        fastcgi_param CONTENT_TYPE $content_type;
        fastcgi_param CONTENT_LENGTH $content_length;
        fastcgi_param HTTP_X_GITHUB_EVENT $http_x_github_event;
        fastcgi_param HTTP_X_GITHUB_DELIVERY $http_x_github_delivery;
        fastcgi_param HTTP_X_HUB_SIGNATURE_256 $http_x_hub_signature_256;

        fastcgi_connect_timeout 3s;
        fastcgi_send_timeout 10s;
        fastcgi_read_timeout 10s;
        fastcgi_pass unix:/web/vmsh_tasks_bot/deploy/runtime/webhook/vmsh-webhook.sock;
    }
