[server]
protocol = http
http_addr = 127.0.0.1
http_port = 3001
domain = grafprep.leaders.tech
enforce_domain = true
root_url = https://grafprep.leaders.tech/
router_logging = false

[security]
admin_user = admin
admin_password = $__file{/etc/grafana/admin_password}
secret_key = $__file{/etc/grafana/secret_key}
cookie_secure = true
cookie_samesite = strict
disable_gravatar = true

[users]
allow_sign_up = false
allow_org_create = false
viewers_can_edit = false

[auth.basic]
enabled = true

[auth.anonymous]
enabled = false

[analytics]
enabled = false
reporting_enabled = false
check_for_updates = false
check_for_plugin_updates = false

[plugins]
preinstall_disabled = true

[snapshots]
external_enabled = false

[dashboards]
min_refresh_interval = 15s
versions_to_keep = 10
default_home_dashboard_path = /var/lib/grafana/dashboards/tlf-prep-overview.json

[log]
mode = console
level = info

[live]
max_connections = 20
