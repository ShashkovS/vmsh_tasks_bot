# Initial ACME-only virtual host, before administrator bootstrap.
server {
    listen 80;
    listen [::]:80;
    server_name glitch.leaders.tech;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/glitchtip-acme;
        default_type text/plain;
    }

    location / {
        return 404;
    }
}
