server {
    listen 80;
    listen [::]:80;
    server_name glitch.leaders.tech;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/glitchtip-acme;
        default_type text/plain;
    }
    location / {
        return 301 https://glitch.leaders.tech$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name glitch.leaders.tech;
    ssl_certificate /etc/letsencrypt/live/glitch.leaders.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/glitch.leaders.tech/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 40m;

    location / {
        proxy_pass http://127.0.0.1:8011;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering on;
        proxy_read_timeout 60s;
    }
}
