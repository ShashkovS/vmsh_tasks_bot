openapi: 3.1.0
info:
  title: VMSh Tasks Bot HTTP API
  version: 0.1.0
  description: |
    Public routes exposed by the aiohttp applications bundled with VMSh Tasks Bot.
    The Telegram bot operates through Telegram infrastructure and is not included here.
servers:
  - url: https://{host}
    description: Production deployment
    variables:
      host:
        default: example.org
  - url: http://127.0.0.1:8179
    description: Local development server started by ``python main.py``
paths:
  /stat:
    post:
      summary: Teacher login for statistics dashboard
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                password:
                  type: string
                  description: Teacher web token issued by the bot
              required:
                - password
      responses:
        "302":
          description: Login succeeded; browser receives a redirect with an authentication cookie
        "200":
          description: Invalid credentials; login page HTML is returned
    get:
      summary: Render the statistics dashboard
      responses:
        "200":
          description: HTML response. Returns the dashboard when authenticated or the login form otherwise.
          content:
            text/html:
              schema:
                type: string
        "401":
          description: Authentication required (rare paths may return this when cookies fail validation)
  /res:
    post:
      summary: Teacher login for results dashboard
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                password:
                  type: string
                  description: Teacher web token issued by the bot
              required:
                - password
      responses:
        "302":
          description: Login succeeded; browser receives a redirect with an authentication cookie
        "200":
          description: Invalid credentials; login page HTML is returned
    get:
      summary: Render the results dashboard
      responses:
        "200":
          description: HTML response. Returns the dashboard when authenticated or the login form otherwise.
          content:
            text/html:
              schema:
                type: string
        "401":
          description: Authentication required (rare paths may return this when cookies fail validation)
  /game:
    get:
      summary: Render the cooperative game board
      responses:
        "200":
          description: HTML response. Returns the game board when the cookie is valid or the login form otherwise.
          content:
            text/html:
              schema:
                type: string
    post:
      summary: Submit the game login form
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                password:
                  type: string
                  description: Web token issued to the student or teacher
              required:
                - password
      responses:
        "200":
          description: Returns the game board HTML when the token is valid or the login form when invalid.
  /game/webtoken/{webtoken}:
    get:
      summary: Exchange a raw web token for an authenticated session
      parameters:
        - name: webtoken
          in: path
          required: true
          schema:
            type: string
          description: Token generated by the bot for direct login links
      responses:
        "303":
          description: Redirects the browser to /game. Cookies are only set when the token is valid.
  /game/buy:
    post:
      summary: Purchase a tile on the cooperative game map
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GamePurchaseRequest'
      responses:
        "200":
          description: Purchase accepted and broadcast to other clients
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameResponse'
        "400":
          description: Validation failed; ignored request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameResponse'
        "401":
          description: Authentication required
  /game/flag:
    post:
      summary: Place a flag on the game map
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GameFlagRequest'
      responses:
        "200":
          description: Flag placement accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameResponse'
        "400":
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameResponse'
        "401":
          description: Authentication required
  /game/chest:
    post:
      summary: Record a treasure chest reward for a student
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GameChestRequest'
      responses:
        "200":
          description: Reward recorded and published to subscribers
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameResponse'
        "400":
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameResponse'
        "401":
          description: Authentication required
  /zoomevents:
    post:
      summary: Receive Zoom meeting webhooks
      description: |
        Handles Zoom URL validation, waiting room events, and breakout room state changes.
        Events unrelated to the configured meeting ID are acknowledged with HTTP 200 without side effects.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ZoomWebhookPayload'
      responses:
        "200":
          description: Event accepted and processed (or ignored if out of scope)
        "400":
          description: Payload could not be parsed
  /tst:
    get:
      summary: Health check route exposed by the Zoom module
      responses:
        "200":
          description: Plain text confirming the service is running
          content:
            text/plain:
              schema:
                type: string
components:
  schemas:
    GamePurchaseRequest:
      type: object
      properties:
        x:
          type: integer
          description: Map column index (0-200)
        y:
          type: integer
          description: Map row index (0-200)
        amount:
          type: integer
          minimum: 1
          maximum: 10
          description: Number of points spent on the tile
        chest:
          type: string
          enum:
            - chest
          description: When set to "chest", records a free chest opening instead of a paid tile
      required:
        - x
        - y
      additionalProperties: false
    GameFlagRequest:
      type: object
      properties:
        x:
          type: integer
          description: Map column index (0-200)
        y:
          type: integer
          description: Map row index (0-200)
      required:
        - x
        - y
      additionalProperties: false
    GameChestRequest:
      type: object
      properties:
        x:
          type: integer
          description: Map column index (0-200)
        y:
          type: integer
          description: Map row index (0-200)
        bonus:
          type: integer
          minimum: 1
          maximum: 10
          description: Reward value granted to the student
      required:
        - x
        - y
        - bonus
      additionalProperties: false
    GameResponse:
      type: object
      properties:
        ok:
          type: string
          description: Either "sure" when processed or "ignored" when rejected
      required:
        - ok
      additionalProperties: false
    ZoomWebhookPayload:
      type: object
      properties:
        event:
          type: string
          description: Zoom event type (e.g. meeting.participant_joined)
        event_ts:
          type: integer
          description: Millisecond epoch timestamp
        payload:
          type: object
          additionalProperties: true
          description: Raw Zoom payload forwarded to the parser
      required:
        - event
        - event_ts
        - payload
      additionalProperties: false
